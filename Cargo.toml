[package]
name = "strix-pipeline"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "strix-pipeline"
path = "src/bin/strix-pipeline.rs"

[dependencies]
capitalize = "0.3.4"
clap = { version = "4.6.1", features = ["derive"] }
counter = "0.7.1"
exn = "0.3.1"
fs-err = "3.3.0"
glob = "0.3.3"
hashbrown = { version = "0.17.1", features = ["serde"] }
itertools = "0.15.0"
log = "0.4.33"
quick-xml = "0.40.1"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "0.0.27"
serde_json = "1.0.150"
thiserror = "2.0.18"
time = "0.3.49"
